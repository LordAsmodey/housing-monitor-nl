backend/frontend boundaries; contracts (DTO/runtime schema, version, errors,
ownership, события); data/migration; alternatives; risks; verification strategy;
constraints_for_orchestrator (зависимости, границы файлов, один владелец общих
contracts/schema/bootstrap/lockfiles); optional adr_candidate.
Не выдавай эти ограничения за готовый task plan. Предложения правил AGENTS.md
не применяются автоматически. При реальном конфликте приведи основания и
нужное решение; не останавливайся только потому, что задача затрагивает модули.
'''
