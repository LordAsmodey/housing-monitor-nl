name: DC Wonen live smoke
on:
  pull_request:
    paths: ['src/sources/dcwonen*.ts', 'scripts/dcwonen-check.cjs', 'scripts/search-modules/dcwonen.cjs', 'test/dcwonen.test.ts', '.github/workflows/dcwonen-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dcwonen-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test test/dcwonen.test.ts
      - name: Read all real search pages without database or Telegram
        run: node scripts/dcwonen-check.cjs
