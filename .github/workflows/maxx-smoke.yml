name: Maxx Huren live smoke
on:
  pull_request:
    paths: ['scripts/maxx-*.cjs', 'scripts/search-modules/maxx.cjs', 'src/sources/maxx*.ts', 'test/maxx.test.ts', '.github/workflows/maxx-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maxx-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test test/maxx.test.ts
      - name: Read and validate filtered public search without database or delivery
        run: node --import tsx -e 'require("./src/sources/maxx-core.ts").collect().then(r=>console.log(JSON.stringify({inspected:r.inspected,matched:r.listings.length,available:r.available}))).catch(e=>{console.error(e.category||"LIVE_SMOKE_FAILED");process.exitCode=1})'
