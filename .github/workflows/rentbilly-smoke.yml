name: RentBilly live smoke
on:
  pull_request:
    paths: ['scripts/rentbilly-*.cjs', 'scripts/search-modules/rentbilly.cjs', 'src/sources/rentbilly*.ts', 'test/rentbilly.test.ts', '.github/workflows/rentbilly-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rentbilly-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test test/rentbilly.test.ts
      - name: Read and validate all public search pages without database or delivery
        run: node --import tsx scripts/rentbilly-check.cjs
