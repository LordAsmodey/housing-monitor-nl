name: Woldring live smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect public catalog
        run: |
          node <<'JS'
          (async()=>{
            for(const path of ['appartementen','studios']) {
              const r=await fetch('https://woldringverhuur.nl/'+path+'/',{signal:AbortSignal.timeout(30000)});
              const html=await r.text();
              console.log('CATALOG',path,r.status,html.length);
              console.log('HEADING',html.match(/<h1\b[^>]*>[\s\S]*?<\/h1>/i)?.[0]);
              const pos=html.indexOf('Per direct beschikbaar');
              console.log('FIRST_CARD_HTML',html.slice(Math.max(0,pos-2200),pos+3200));
              console.log('RESULT_COUNT',html.match(/.{0,100}resultaten.{0,100}/i)?.[0]);
              console.log('STATUS_COUNTS', [...html.matchAll(/Per direct beschikbaar|Beschikbaar per:|Niet beschikbaar/g)].reduce((a,m)=>(a[m[0]]=(a[m[0]]||0)+1,a),{}));
            }
          })().catch(()=>{console.error('LIVE_FETCH_FAILED');process.exit(1)});
          JS
