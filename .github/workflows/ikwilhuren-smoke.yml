name: Ikwilhuren live smoke
on:
  pull_request:
    paths: ['scripts/ikwilhuren-*.cjs', 'scripts/search-modules/ikwilhuren.cjs', 'src/sources/ikwilhuren*.ts', 'test/ikwilhuren.test.ts', '.github/workflows/ikwilhuren-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ikwilhuren-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test test/ikwilhuren.test.ts
      - name: Read and validate complete public catalog without database or delivery
        run: node --import tsx -e 'require("./src/sources/ikwilhuren-core.ts").collect().then(r=>console.log(JSON.stringify({inspected:r.inspected,matched:r.listings.length,available:r.available,pages:r.pages}))).catch(e=>{console.error(e.category||"LIVE_SMOKE_FAILED");process.exitCode=1})'
