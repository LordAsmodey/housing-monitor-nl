name: Rentola live smoke
on:
  pull_request:
    paths: ['scripts/rentola-*.cjs', 'scripts/search-modules/rentola.cjs', 'src/sources/rentola*.ts', 'test/rentola.test.ts', '.github/workflows/rentola-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rentola-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test test/rentola.test.ts
      - name: Validate daily discovery and cached head scan without database or delivery
        run: node --import tsx scripts/rentola-check.cjs
