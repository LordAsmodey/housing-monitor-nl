name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  pr-target-guard:
    runs-on: ubuntu-latest
    steps:
      # Default pull_request checkout is refs/pull/<number>/merge, never head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:ci
      - run: npm run ci:pr-target
      - name: Validate merge-result against event base and head
        run: npm run ci:merge-result
  # Application checks retain the default checkout of the validated event SHA.
  funda-image:
    needs: pr-target-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.browser -t housing-funda:ci .
  application-image:
    needs: pr-target-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t housing-app:ci .
      - name: Verify runtime includes admin bundle and generated Prisma models
        run: >-
          docker run --rm --network none --entrypoint node housing-app:ci -e
          'const fs=require("node:fs"),assert=require("node:assert/strict");
          assert.ok(fs.existsSync("admin/dist/index.html"));
          const client=new(require("@prisma/client").PrismaClient)();
          assert.equal(typeof client.searchConfiguration.findUnique,"function");
          void client.$disconnect();'
  huurwoningen-image:
    needs: pr-target-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" -f Dockerfile.huurwoningen-experiment -t housing-huurwoningen:ci .
      - run: docker run --rm --entrypoint node housing-huurwoningen:ci -e 'const fs=require("node:fs"),assert=require("node:assert/strict"); assert.equal(fs.readFileSync("/app/REVISION","utf8").trim(),process.argv[1]); assert.equal(typeof require("patchright").chromium.launchPersistentContext,"function");' "$GITHUB_SHA"
      - run: docker run --rm --init --network none --entrypoint node -v "$PWD/scripts/browser-profile-smoke.cjs:/app/scripts/browser-profile-smoke.cjs:ro" housing-huurwoningen:ci scripts/browser-profile-smoke.cjs
  pararius-image:
    needs: pr-target-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" -f Dockerfile.pararius-browser -t housing-pararius:ci .
      - run: docker run --rm --network none --entrypoint node housing-pararius:ci -e 'const assert=require("node:assert/strict"); assert.equal(typeof require("./scripts/pararius-browser-session.cjs").searchReady,"function"); assert.equal(require("./scripts/pararius-core.cjs").SOURCE_ID,"pararius:groningen-25km-homes");'
      - run: docker run --rm --init --network none --entrypoint node -v "$PWD/scripts/pararius-profile-smoke.cjs:/app/scripts/pararius-profile-smoke.cjs:ro" housing-pararius:ci scripts/pararius-profile-smoke.cjs
  check:
    needs: pr-target-guard
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://housing:test@localhost:5432/housing
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: test
          POSTGRES_DB: housing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U housing -d housing"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix admin --no-audit --no-fund
      - run: npm run admin:build
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run typecheck:ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run db:validate
